<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Voice Assistant</title>
  <meta name="description" content="A Jarvis-style voice assistant with speech recognition and spoken responses.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #04070d;
      --panel: #0a1220;
      --panel-2: #111f35;
      --cyan: #37d6ff;
      --cyan-soft: #7ee6ff;
      --green: #7dffb3;
      --text: #e8f8ff;
      --muted: #89a8b8;
      --danger: #ff6d7a;
      --shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      --ring: 0 0 0 1px rgba(55, 214, 255, 0.4), 0 0 30px rgba(55, 214, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(55, 214, 255, 0.12), transparent 35%),
        radial-gradient(circle at bottom left, rgba(125, 255, 179, 0.08), transparent 40%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 1.25rem;
    }

    .jarvis-app {
      width: min(1000px, 100%);
      border-radius: 24px;
      background: linear-gradient(170deg, rgba(17, 31, 53, 0.95), rgba(7, 12, 22, 0.95));
      box-shadow: var(--shadow);
      border: 1px solid rgba(55, 214, 255, 0.2);
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid rgba(55, 214, 255, 0.2);
      background: rgba(4, 9, 16, 0.6);
    }

    .title {
      font-family: Orbitron, sans-serif;
      letter-spacing: 0.1em;
      font-size: 1.1rem;
      color: var(--cyan-soft);
    }

    .status {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .status strong {
      color: var(--green);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      padding: 1.25rem;
    }

    .panel {
      background: linear-gradient(155deg, rgba(10, 18, 32, 0.9), rgba(6, 12, 22, 0.9));
      border: 1px solid rgba(126, 230, 255, 0.18);
      border-radius: 18px;
      padding: 1rem;
      box-shadow: inset 0 0 0 1px rgba(16, 43, 63, 0.5);
    }

    .orbs-wrap {
      display: grid;
      place-items: center;
      min-height: 320px;
    }

    .orb {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 2px solid rgba(126, 230, 255, 0.55);
      box-shadow: var(--ring);
      background:
        radial-gradient(circle at 45% 35%, rgba(126, 230, 255, 0.6), rgba(55, 214, 255, 0.15) 40%, rgba(55, 214, 255, 0.05) 70%, transparent 78%),
        radial-gradient(circle at center, rgba(13, 51, 79, 0.65), rgba(4, 12, 22, 0.85));
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .orb::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 1px solid rgba(125, 255, 179, 0.4);
      opacity: 0.7;
    }

    .orb.listening {
      animation: pulse 1.25s ease-in-out infinite;
      box-shadow: 0 0 0 1px rgba(125, 255, 179, 0.45), 0 0 35px rgba(125, 255, 179, 0.35);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .controls {
      margin-top: 1rem;
      display: grid;
      gap: 0.75rem;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 0.8rem 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, #36d2ff, #82e7ff);
      color: #05202f;
    }

    .btn-secondary {
      background: rgba(125, 255, 179, 0.2);
      color: var(--green);
      border: 1px solid rgba(125, 255, 179, 0.35);
    }

    .btn-muted {
      background: rgba(255, 255, 255, 0.08);
      color: #c7e5f2;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .field {
      display: grid;
      gap: 0.35rem;
    }

    .label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    input, select, textarea {
      width: 100%;
      background: rgba(7, 14, 25, 0.95);
      color: var(--text);
      border: 1px solid rgba(132, 209, 240, 0.3);
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
      font: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 84px;
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      min-height: 560px;
    }

    .feed {
      flex: 1;
      overflow: auto;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 14px;
      border: 1px solid rgba(126, 230, 255, 0.15);
      padding: 0.85rem;
      display: grid;
      gap: 0.75rem;
    }

    .message {
      padding: 0.75rem;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .message.user {
      background: rgba(55, 214, 255, 0.13);
      border: 1px solid rgba(55, 214, 255, 0.3);
    }

    .message.jarvis {
      background: rgba(125, 255, 179, 0.12);
      border: 1px solid rgba(125, 255, 179, 0.3);
    }

    .message.system {
      background: rgba(255, 255, 255, 0.08);
      color: #b8d0dd;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .chat-controls {
      margin-top: 0.8rem;
      display: grid;
      gap: 0.65rem;
    }

    .hint {
      margin-top: 0.7rem;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .danger { color: var(--danger); }

    @media (max-width: 920px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="jarvis-app">
    <header class="header">
      <h1 class="title">JARVIS // PERSONAL AI CORE</h1>
      <div class="status">State: <strong id="stateText">Idle</strong></div>
    </header>

    <section class="main-grid">
      <div class="panel">
        <div class="orbs-wrap">
          <div id="orb" class="orb" aria-hidden="true"></div>
        </div>

        <div class="controls">
          <button id="toggleListenBtn" class="btn btn-primary">Start Listening</button>
          <button id="speakLastBtn" class="btn btn-secondary">Speak Last Response</button>
          <button id="clearBtn" class="btn btn-muted">Clear Conversation</button>
        </div>

        <div class="controls" style="margin-top: 1rem;">
          <div class="field">
            <label class="label" for="apiKeyInput">Optional OpenAI API Key</label>
            <input id="apiKeyInput" type="password" placeholder="sk-... (stored only in your browser)">
          </div>

          <div class="field">
            <label class="label" for="modelInput">Model Name</label>
            <input id="modelInput" type="text" value="gpt-4.1-mini">
          </div>

          <div class="field">
            <label class="label" for="systemPromptInput">System Prompt</label>
            <textarea id="systemPromptInput">You are JARVIS, a concise and helpful AI assistant. Speak naturally and keep responses practical.</textarea>
          </div>
        </div>

        <p class="hint">
          Voice command examples: "What time is it?", "Open YouTube", "Search for climate news", "Set mode to stealth".
        </p>
        <p class="hint">
          Browser support: speech recognition works best in Chromium-based browsers.
        </p>
      </div>

      <div class="panel chat-panel">
        <div id="feed" class="feed" aria-live="polite"></div>
        <div class="chat-controls">
          <div class="field">
            <label class="label" for="manualPromptInput">Manual Command</label>
            <textarea id="manualPromptInput" placeholder="Type a command for Jarvis..."></textarea>
          </div>
          <button id="sendPromptBtn" class="btn btn-primary">Send Command</button>
        </div>
        <p id="supportNotice" class="hint"></p>
      </div>
    </section>
  </main>

  <script>
    const stateText = document.getElementById("stateText");
    const orb = document.getElementById("orb");
    const toggleListenBtn = document.getElementById("toggleListenBtn");
    const speakLastBtn = document.getElementById("speakLastBtn");
    const clearBtn = document.getElementById("clearBtn");
    const sendPromptBtn = document.getElementById("sendPromptBtn");
    const manualPromptInput = document.getElementById("manualPromptInput");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const modelInput = document.getElementById("modelInput");
    const systemPromptInput = document.getElementById("systemPromptInput");
    const feed = document.getElementById("feed");
    const supportNotice = document.getElementById("supportNotice");

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let listening = false;
    let lastJarvisResponse = "Online and ready.";
    let voicesReady = false;

    function addMessage(role, text) {
      const entry = document.createElement("div");
      entry.className = "message " + role;
      entry.textContent = text;
      feed.appendChild(entry);
      feed.scrollTop = feed.scrollHeight;
    }

    function setState(text, isListening) {
      stateText.textContent = text;
      if (isListening) {
        orb.classList.add("listening");
      } else {
        orb.classList.remove("listening");
      }
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        addMessage("system", "Speech synthesis is not supported in this browser.");
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1;
      utterance.pitch = 0.95;
      utterance.volume = 1;

      if (voicesReady) {
        const preferredVoice = window.speechSynthesis
          .getVoices()
          .find((voice) => /en|us|uk/i.test(voice.lang) && /google|zira|david|male|samantha/i.test(voice.name));
        if (preferredVoice) {
          utterance.voice = preferredVoice;
        }
      }

      utterance.onstart = () => setState("Speaking", false);
      utterance.onend = () => setState(listening ? "Listening" : "Idle", listening);
      window.speechSynthesis.speak(utterance);
    }

    function normalizeInput(text) {
      return text.trim().replace(/\s+/g, " ");
    }

    function builtInResponse(input) {
      const lower = input.toLowerCase();

      if (lower.includes("time")) {
        return "The current time is " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + ".";
      }

      if (lower.includes("date") || lower.includes("day")) {
        return "Today is " + new Date().toLocaleDateString([], { weekday: "long", year: "numeric", month: "long", day: "numeric" }) + ".";
      }

      if (lower.includes("open youtube")) {
        window.open("https://www.youtube.com", "_blank", "noopener");
        return "Opening YouTube now.";
      }

      if (lower.includes("open google")) {
        window.open("https://www.google.com", "_blank", "noopener");
        return "Opening Google.";
      }

      if (lower.startsWith("search for ")) {
        const query = input.slice("search for ".length);
        window.open("https://www.google.com/search?q=" + encodeURIComponent(query), "_blank", "noopener");
        return "Searching for " + query + ".";
      }

      if (lower.includes("clear screen") || lower.includes("clear conversation")) {
        feed.innerHTML = "";
        return "Conversation cleared.";
      }

      if (lower.includes("who are you")) {
        return "I am Jarvis, your browser-based AI assistant. Ready for your command.";
      }

      return null;
    }

    async function askOpenAI(input) {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) return null;

      const model = modelInput.value.trim() || "gpt-4.1-mini";
      const systemPrompt = systemPromptInput.value.trim() || "You are JARVIS, a concise and helpful AI assistant.";

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + apiKey
          },
          body: JSON.stringify({
            model,
            temperature: 0.7,
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: input }
            ]
          })
        });

        if (!response.ok) {
          const text = await response.text();
          return "I could not reach the AI model. " + text.slice(0, 160);
        }

        const data = await response.json();
        return data.choices?.[0]?.message?.content?.trim() || "No response returned from the model.";
      } catch (error) {
        return "Network error while reaching the AI API: " + error.message;
      }
    }

    async function processCommand(rawText) {
      const input = normalizeInput(rawText);
      if (!input) return;

      addMessage("user", input);
      setState("Thinking", false);

      let output = builtInResponse(input);
      if (!output) {
        output = await askOpenAI(input);
      }
      if (!output) {
        output = "I heard: \"" + input + "\". Add an API key to get advanced AI responses.";
      }

      lastJarvisResponse = output;
      addMessage("jarvis", output);
      speak(output);
    }

    function startListening() {
      if (!recognition) return;
      recognition.start();
    }

    function stopListening() {
      if (!recognition) return;
      recognition.stop();
      listening = false;
      setState("Idle", false);
      toggleListenBtn.textContent = "Start Listening";
    }

    function setupRecognition() {
      if (!Recognition) {
        supportNotice.innerHTML = "<span class='danger'>Speech recognition is not available in this browser.</span>";
        toggleListenBtn.disabled = true;
        setState("Unavailable", false);
        addMessage("system", "Voice input unavailable. Use manual command input.");
        return;
      }

      recognition = new Recognition();
      recognition.lang = "en-US";
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onstart = () => {
        listening = true;
        setState("Listening", true);
        toggleListenBtn.textContent = "Stop Listening";
        addMessage("system", "Voice capture started.");
      };

      recognition.onresult = (event) => {
        const result = event.results[event.results.length - 1];
        if (result && result[0]) {
          processCommand(result[0].transcript);
        }
      };

      recognition.onerror = (event) => {
        setState("Error", false);
        addMessage("system", "Speech recognition error: " + event.error);
      };

      recognition.onend = () => {
        if (listening) {
          recognition.start();
        } else {
          setState("Idle", false);
        }
      };
    }

    toggleListenBtn.addEventListener("click", () => {
      if (!recognition) return;
      if (listening) {
        stopListening();
      } else {
        startListening();
      }
    });

    speakLastBtn.addEventListener("click", () => {
      speak(lastJarvisResponse);
    });

    clearBtn.addEventListener("click", () => {
      feed.innerHTML = "";
      addMessage("system", "Conversation memory cleared.");
    });

    sendPromptBtn.addEventListener("click", () => {
      processCommand(manualPromptInput.value);
      manualPromptInput.value = "";
    });

    manualPromptInput.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        sendPromptBtn.click();
      }
    });

    window.speechSynthesis.onvoiceschanged = () => {
      voicesReady = true;
    };

    addMessage("jarvis", "Systems online. Say a command or type one below.");
    setupRecognition();
  </script>
</body>
</html>
