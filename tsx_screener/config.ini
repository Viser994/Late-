# TSX Screener Configuration
# Copy this file to config.ini and fill in your API keys.
# Only yfinance (no key needed) is required. All others are optional but improve data quality.

[api_keys]
# FinancialModelingPrep free tier: https://financialmodelingprep.com/developer/docs/
# Free plan gives 250 requests/day
financialmodelingprep =

# Finnhub free tier: https://finnhub.io/
# Free plan gives 60 requests/minute
finnhub =

# Alpha Vantage free tier: https://www.alphavantage.co/support/#api-key
# Free plan gives 25 requests/day
alpha_vantage =

[settings]
# How many days before cached stock data expires and is re-fetched
data_cache_days = 1

# How many days before the TSX ticker list is refreshed
ticker_cache_days = 7

# Number of parallel workers for data fetching (reduce if hitting rate limits)
max_workers = 8

# Minimum market cap filter in CAD millions (0 = no filter)
min_market_cap_millions = 0

# Display results per page
results_per_page = 50

[scoring_weights]
# Weights for the composite score. Must add up to 1.0
value    = 0.25
quality  = 0.25
growth   = 0.25
momentum = 0.15
dividend = 0.10
