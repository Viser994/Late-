[api_keys]
# Enter keys once here, then save this file as config.ini.
# Providers are tried in this order: FinancialModelingPrep, Finnhub,
# Alpha Vantage, Yahoo Finance/yfinance.
financialmodelingprep =
finnhub =
alpha_vantage =

[scanner]
# Delay between symbols helps avoid free-tier rate limits.
request_delay_seconds = 0.25
request_timeout_seconds = 20

[paths]
universe_cache = data/tsx_universe.json
results_cache = data/latest_results.csv
