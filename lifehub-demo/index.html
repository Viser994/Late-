<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeHub</title>
  <meta name="description" content="LifeHub keeps your personal tasks, documents, and reminders organized in one simple place.">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Personal life admin</p>
        <h1>LifeHub</h1>
      </div>
      <button class="icon-button" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
    </header>

    <main class="main-content">
      <section id="todayTab" class="tab-panel active" aria-label="Today dashboard"></section>
      <section id="documentsTab" class="tab-panel" aria-label="Documents"></section>
      <section id="settingsTab" class="tab-panel" aria-label="Settings"></section>
    </main>

    <nav class="tab-nav" aria-label="Main navigation">
      <button class="tab-button active" data-tab="today">Today</button>
      <button class="tab-button" data-tab="documents">Documents</button>
      <button class="tab-button" data-tab="settings">Settings</button>
    </nav>
  </div>

  <div class="modal-overlay hidden" id="onboardingModal" role="dialog" aria-modal="true" aria-labelledby="onboardingTitle">
    <div class="modal">
      <h2 id="onboardingTitle">Welcome to LifeHub</h2>
      <p>Organize bills, reminders, appointments, and important documents in one secure-feeling place.</p>
      <ul>
        <li>Track urgent tasks and deadlines.</li>
        <li>Store IDs, warranties, and receipts.</li>
        <li>Get simple AI summaries from long documents.</li>
      </ul>
      <button id="completeOnboardingBtn" class="primary-button">Get Started</button>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
