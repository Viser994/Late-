<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="description" content="LifeHub — organize bills, reminders, appointments, documents and warranties in one calm, secure place." />
  <meta name="theme-color" content="#4f7cff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="LifeHub" />
  <title>LifeHub — Your personal life admin</title>

  <!-- App icon (inline SVG data URI so the demo is fully self-contained) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f7cff'/%3E%3Cpath d='M12 5 6 7.5v4.2C6 15.5 8.6 17.6 12 18.5c3.4-.9 6-3 6-6.8V7.5z' fill='none' stroke='white' stroke-width='1.4'/%3E%3Cpath d='M9.5 12l1.7 1.7L14.8 10' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Apply the saved theme before first paint to avoid a light/dark flash. -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('lifehub.state.v1') || '{}');
        var pref = s.theme || 'system';
        var dark = pref === 'dark' ||
          (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Phone-shaped app frame (centered on desktop, full-bleed on mobile) -->
  <main class="device" role="application" aria-label="LifeHub app">
    <!-- Scrollable screen: active view renders here -->
    <section id="screen" class="screen" aria-live="polite"></section>

    <!-- Floating action button (add task / document) -->
    <button id="fab" class="fab" aria-label="Add"></button>

    <!-- Bottom navigation -->
    <nav id="tabbar" class="tabbar" aria-label="Primary"></nav>

    <!-- Hosts for overlays -->
    <div id="sheet-host"></div>
    <div id="toast-host" class="toast-wrap"></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
