; =============================================================================
;  TSX Stock Scanner - configuration
; =============================================================================
;  1. Copy this file to "config.ini" (same folder).
;  2. Paste your free API keys below (you only ever do this once).
;  3. Leave a key blank if you do not have it - the scanner will simply skip
;     that provider and fall back to the next one in `provider_order`.
;
;  You can run the whole application with NO keys at all: it will fall back to
;  Yahoo Finance (yfinance), which needs no key.
; =============================================================================

[api_keys]
; https://site.financialmodelingprep.com/developer/docs  (free tier)
financialmodelingprep =
; https://finnhub.io/  (free tier)
finnhub =
; https://www.alphavantage.co/support/#api-key  (free tier)
alpha_vantage =

[settings]
; Order in which data providers are tried. The first that returns usable data
; for a ticker wins; the rest are used only as fallbacks.
; Valid names: fmp, finnhub, alpha_vantage, yfinance
provider_order = fmp,finnhub,alpha_vantage,yfinance

; Number of tickers fetched in parallel.
max_workers = 8

; Network timeout per request, in seconds.
request_timeout = 20

; How long a cached scan / ticker-universe stays fresh before it is refetched.
cache_ttl_hours = 12

; Also scan the TSX Venture Exchange (TSXV) universe when discovering tickers.
include_tsxv = false

[scoring]
; Weights for the composite score. They are normalised automatically, so they
; do not have to sum to exactly 1.0 - only their relative sizes matter.
weight_value = 0.20
weight_quality = 0.25
weight_growth = 0.20
weight_health = 0.15
weight_income = 0.10
weight_momentum = 0.10
