name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p public
          cp -r jarvis-demo shawarma-queen-demo public/
          cp pages-index.html public/index.html
          if [ -d tsx-stock-scanner/web ]; then
            mkdir -p public/tsx-stock-scanner
            cp -r tsx-stock-scanner/web/* public/tsx-stock-scanner/
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
